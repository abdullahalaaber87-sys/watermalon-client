name: Build Watermalon Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Generate Gradle Wrapper
      working-directory: watermalon-mod
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x watermalon-mod/gradlew

    - name: Build with Gradle
      run: ./watermalon-mod/gradlew build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: watermalon-mod-jar
        path: watermalon-mod/build/libs/*.jar
